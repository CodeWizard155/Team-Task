
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTask</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>TeamTask</h1>
    <p>Manage your work, one task at a time.</p>

    <form id="task-form">
      <input id="task-input" placeholder="Enter a task..." required>
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <p id="task-count">0 tasks</p>
    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
